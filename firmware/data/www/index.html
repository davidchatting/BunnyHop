<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BunnyHop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>BunnyHop</h1>
    <span id="status" class="status off">connecting…</span>
  </header>

  <main>
    <section class="card rabbit">
      <div id="rabbit-view"></div>
      <p class="hint">Tap a light to change its colour. Drag an ear to move it.</p>
      <div class="row">
        <button id="ears-up">Ears up</button>
        <button id="lights-off">Lights off</button>
      </div>
    </section>

    <section class="card">
      <h2>Sounds</h2>
      <div id="sounds" class="sounds"></div>
      <label class="upload">
        <input type="file" id="sound-file" accept=".mp3,.wav,audio/mpeg,audio/wav">
        <span>Add a sound…</span>
      </label>
    </section>

    <section class="card">
      <h2>Activity</h2>
      <ul id="activity" class="activity">
        <li class="empty">Press the rabbit's button, show it a tag, or move its ears.</li>
      </ul>
    </section>

    <details class="card">
      <summary>Connection</summary>
      <dl id="info" class="info"></dl>
      <button id="pair">Pair a rabbit</button>
      <p class="hint">To pair, hold the rabbit's head button while plugging it in, until its lights are blue.</p>
    </details>
  </main>

  <input type="color" id="led-picker" class="picker">

  <script src="lib/p5.min.js"></script>
  <script src="js/rabbit-api.js"></script>
  <script src="js/events.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/sketch.js"></script>
</body>
</html>
