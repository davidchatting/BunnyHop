; Pinned to espressif32@6.10.0 (Arduino core 2.0.17) - already installed on
; this machine and known-good for the Feather ESP32; 7.x pulls IDF 6.
[env:featheresp32]
platform = espressif32@6.10.0
board = featheresp32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
    esp32async/AsyncTCP@^3.4.0
    esp32async/ESPAsyncWebServer@^3.7.0
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAUTO_PAIR=0
